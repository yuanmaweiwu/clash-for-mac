			shellScript = "set -eu\n\n# ADR-0012：内核与 geodata 改为运行时下载，包内只保留版本与校验依据\nSRC_DIR=\"$SRCROOT/Resources/Kernel\"\nDEST_DIR=\"$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/Kernel\"\n\n# 清掉旧构建可能残留的二进制 / geodata，保证包内只剩元数据\nrm -rf \"$DEST_DIR\"\nmkdir -p \"$DEST_DIR\"\nfor name in VERSION SHA256; do\n  if [ ! -f \"$SRC_DIR/$name\" ]; then\n    echo \"error: 缺少 $SRC_DIR/$name\"\n    exit 1\n  fi\n  ditto \"$SRC_DIR/$name\" \"$DEST_DIR/$name\"\ndone\necho \"Copied kernel metadata: $DEST_DIR\"\n";
